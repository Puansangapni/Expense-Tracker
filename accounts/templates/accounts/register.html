<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ExpenseTrack</title>

    <style>
        body {
            font-family:Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #157347;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

    </style>
</head>
<body>
    
    <div class="container">
        <h2>Create Account</h2>

        <form method="POST">

            {% csrf_token %}

            {{form.as_p}}

            <button type="submit">
                Register
            </button>
        </form>

        <div class="link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </div>
    </div>
</body>
</html>
