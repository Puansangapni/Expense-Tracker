<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ExpenseTrack</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }


        button:hover {
            background: #0b5ed7;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }
    </style>

</head>
<body>
    
    <div class="container">

        <h2>Login</h2>

        {% if error %}
            <div class="error">
                {{error}}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >

            <button type="submit">
                Login
            </button>
        </form>

        <div class="link">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register
            </a>
        </div>
    </div>

</body>
</html>
